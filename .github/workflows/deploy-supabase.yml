name: Deploy Supabase Functions & Migrations

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Apply DB migrations ──────────────────────────────────────
      - name: Check required secrets
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_PROJECT_REF and/or SUPABASE_ACCESS_TOKEN repository secrets are not set - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: secrets

      - name: Apply Migrations
        if: steps.secrets.outputs.skip != 'true'
        run: |
          # Migrations are also applied directly by Lovable Cloud, so the remote
          # history can already contain versions this push would replay.
          # Never let that divergence block edge function deploys.
          supabase db push \
            --project-ref "$PROJECT_REF" \
            --include-all || echo "::warning::supabase db push reported an error (likely already-applied migrations); continuing"

      # ── Deploy all edge functions ────────────────────────────────
      - name: Deploy Edge Functions
        if: steps.secrets.outputs.skip != 'true'
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            # Skip _shared directories
            if [[ "$fn" == _* ]]; then continue; fi
            echo "Deploying function: $fn"
            supabase functions deploy "$fn" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt || true
          done
